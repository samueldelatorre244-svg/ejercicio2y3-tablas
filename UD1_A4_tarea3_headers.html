<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EDADES</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        th, td {
            border: 2px solid #777;
            padding: 12px 15px;
        }
        .edades { background-color: #BBBBFF; }
        .hombres-principal { background-color: #AAFFAA; }
        .hombres-secundario { background-color: #BBFFBB; }
        .mujeres-principal { background-color: #FFBBBB; }
        .mujeres-secundario { background-color: #FFCCCC; }
        .celda-principal { font-size: 18px; }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
               
                <th rowspan="2" id="materia" class="edades celda-principal">Grupos de edades</th>
                <th colspan="2" id="hombres" class="hombres-principal celda-principal">Hombres</th>
                <th colspan="2" id="mujeres" class="mujeres-principal celda-principal">Mujeres</th>
            </tr>
            <tr>
               
                <th id="h-num" class="hombres-principal">Num</th>
                <th id="h-porcent" class="hombres-principal">%</th>
                <th id="m-num" class="mujeres-principal">Num</th>
                <th id="m-porcent" class="mujeres-principal">%</th>
            </tr>
        </thead>
        <tbody>
            <tr>
               
                <th id="r1" class="edades">8-16</th>
                <td headers="hombres h-num r1" class="hombres-secundario">16</td>
                <td headers="hombres h-porcent r1" class="hombres-secundario">14.5</td>
                <td headers="mujeres m-num r1" class="mujeres-secundario">10</td>
                <td headers="mujeres m-porcent r1" class="mujeres-secundario">9</td>
            </tr>
            <tr>
                <th id="r2" class="edades">17-23</th>
                <td headers="hombres h-num r2" class="hombres-secundario">8</td>
                <td headers="hombres h-porcent r2" class="hombres-secundario">7</td>
                <td headers="mujeres m-num r2" class="mujeres-secundario">13</td>
                <td headers="mujeres m-porcent r2" class="mujeres-secundario">11.5</td>
            </tr>
            <tr>
                <th id="r3" class="edades">24-38</th>
                <td headers="hombres h-num r3" class="hombres-secundario">15</td>
                <td headers="hombres h-porcent r3" class="hombres-secundario">14</td>
                <td headers="mujeres m-num r3" class="mujeres-secundario">8</td>
                <td headers="mujeres m-porcent r3" class="mujeres-secundario">7</td>
            </tr>
            <tr>
                <th id="r4" class="edades">39-56</th>
                <td headers="hombres h-num r4" class="hombres-secundario">21</td>
                <td headers="hombres h-porcent r4" class="hombres-secundario">19</td>
                <td headers="mujeres m-num r4" class="mujeres-secundario">19</td>
                <td headers="mujeres m-porcent r4" class="mujeres-secundario">17</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
